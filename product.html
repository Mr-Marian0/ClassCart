<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details - ClassCart</title>
    <link rel="stylesheet" href="assets/css/header.css" />
    <link rel="stylesheet" href="assets/css/footer.css" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="assets/css/product.css" />
  </head>
  <body>
    <!---------------------- Header Placeholder ---------------------->
    <div class="main-header" id="header-placeholder"></div>

    <!---------------------------- Product Details Section ----------------------------->
    <main class="product-page">
      <div class="card-wrapper">
        <div class="card">
          <!-- Left: Images -->
          <div class="product-imgs">
            <div class="img-display" id="img-display">
              <div class="img-showcase" id="img-showcase"></div>
              <button class="img-zoom-hint" id="img-zoom-hint" type="button" aria-label="Zoom image">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6"/><path d="M8 11h6"/></svg>
              </button>
            </div>
            <div class="img-select" id="img-select"></div>
          </div>

          <!-- Right: Details -->
          <div class="product-content">
            <h1 class="product-title" id="product-title">Loading...</h1>
            <div class="product-rating" id="product-rating"></div>

            <div class="product-price">
              <p class="new-price">Price</p>
              <p class="price-value" id="product-price">₱0</p>
            </div>

            <div class="product-detail">
              <h2>About this item</h2>
              <ul>
                <li>Category: <span id="product-category">—</span></li>
                <li>Availability: <span>In Stock</span></li>
                <li>Shipping Fee: <span>Free</span></li>
              </ul>
            </div>

            <div class="product-tags" id="product-tags"></div>

            <div class="purchase-info">
              <input type="number" id="product-quantity" min="1" max="100" value="1" />
              <button type="button" class="btn" id="add-to-cart-btn">Add to Cart</button>
              <button type="button" class="btn-wishlist" id="wishlist-toggle-btn" title="Save to wishlist" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5S3.5 15.4 3.5 9.6A4.6 4.6 0 0 1 12 6.8a4.6 4.6 0 0 1 8.5 2.8c0 5.8-8.5 10.9-8.5 10.9Z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!------------------------- Image Zoom Lightbox --------------------------->
    <div class="img-lightbox" id="img-lightbox">
      <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close">×</button>
      <button class="lightbox-nav lightbox-prev" id="lightbox-prev" type="button" aria-label="Previous image">‹</button>
      <div class="lightbox-image-wrap" id="lightbox-image-wrap">
        <img id="lightbox-img" src="" alt="" />
      </div>
      <button class="lightbox-nav lightbox-next" id="lightbox-next" type="button" aria-label="Next image">›</button>
      <p class="lightbox-hint">Click image to zoom in/out</p>
    </div>

    <!------------------------- Footer Placeholder --------------------------->
    <div class="footer" id="footer-placeholder"></div>

    <script src="assets/js/header.js"></script>
    <script src="assets/js/footer.js"></script>
    <script type="module" src="assets/js/product.js"></script>
  </body>
</html>
